[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chatcheckin"
version = "0.1.0"
description = "Parse exported WeChat group-chat check-ins into auditable records."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "wrqkkk"}]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
chatcheckin = "chatcheckin.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
